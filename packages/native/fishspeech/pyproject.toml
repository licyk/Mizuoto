[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizuoto-fishspeech"
description = "Fish Speech S2 for Mizuoto's native runtime (Fish Audio Research License)"
requires-python = ">=3.10"
dynamic = ["version"]
license = "LicenseRef-Fish-Audio-Research"
# A separate distribution because the Fish Audio Research License covers this port. It runs inside Mizuoto's own environment and registers itself as an engine.
# The Mizuoto versions it works with: its code uses Mizuoto's runtime, and its manifest ships in mizuoto. The lower bound is
# the oldest release with everything it uses (CI tests it); the upper one the next minor, while Mizuoto is 0.x.
dependencies = ["mizuoto>=0.2.0,<0.3", "tokenizers>=0.20", "safetensors"]

[project.entry-points."mizuoto.engines"]
fishspeech = "mizuoto_fishspeech:FishSpeechEngine"

[tool.setuptools.packages.find]
where = ["."]
include = ["mizuoto_fishspeech*"]

[tool.setuptools.package-data]
mizuoto_fishspeech = ["LICENSE.md"]

[tool.setuptools.dynamic]
version = { attr = "mizuoto_fishspeech.version.VERSION" }
