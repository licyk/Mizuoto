# The distributions, each released on its own: the mizuoto wheel and sdist, with the web UI built in, and the
# licence-gated engines' wheels (mizuoto-fishspeech, mizuoto-indextts). What a run releases (scripts/ci.py release):
# - a push to main releases each distribution whose version file it changes (mizuoto/version.py,
#   packages/native/<id>/mizuoto_<id>/version.py);
# - a tag releases the one it names and must match its version: v<version> for Mizuoto, mizuoto-<id>-v<version> for a
#   gated engine; it also gets a GitHub release with that distribution's files;
# - a manual run releases what its input names.
# The chosen distributions are built, tried in a new environment with a CPU torch and the other distributions as
# released on PyPI, and published with twine once every check passes.
name: Release

on:
  push:
    branches: [main]
    # GitHub does not apply path filters to tag pushes: a matching tag always releases.
    tags: ["v*", "mizuoto-*-v*"]
    paths: ["mizuoto/version.py", "packages/native/*/mizuoto_*/version.py"]
  workflow_dispatch:
    inputs:
      packages:
        description: "What to release (a version already on PyPI is skipped)"
        type: choice
        default: all
        options: [all, mizuoto, mizuoto-fishspeech, mizuoto-indextts]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # uv installs into the interpreter setup-python provides (no virtual environment); its cache stays off, as in
  # ci.yml. smoke_wheels.py runs uv without UV_* variables, so its new environment is not affected.
  UV_SYSTEM_PYTHON: 1

jobs:
  plan:
    name: What to release
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      host: ${{ steps.plan.outputs.host }}
      gated_ids: ${{ steps.plan.outputs.gated_ids }}
      names: ${{ steps.plan.outputs.names }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: plan
        # A push's changed files come from the compare API, as CI's scope job reads them.
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          files=""
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
            printf 'Changed files:\n%s\n' "$files"
          fi
          python3 scripts/ci.py release --packages "${PACKAGES:-all}" <<< "$files"

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.any == 'true'
    # CI's own run of this push skips itself (its scope job), so the checks run once, here, for what the push changes.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ needs.plan.outputs.names }}
    needs: [plan, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        if: needs.plan.outputs.host == 'true'
      - run: uv pip install --upgrade twine

      - name: Build
        # build_wheels.py needs only the standard library, uv and bun; it builds the web UI first.
        env:
          GATED: ${{ needs.plan.outputs.gated_ids }}
        run: |
          if [ "${{ needs.plan.outputs.host }}" = true ]; then python scripts/build_wheels.py host; fi
          read -ra engines <<< "$GATED"
          if [ ${#engines[@]} -gt 0 ]; then python scripts/build_wheels.py native "${engines[@]}"; fi
          ls -l dist

      - name: Check the metadata
        # Not --strict: the gated packages have no README, so twine warns that their long description is missing.
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke · Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install the wheels with the released distributions they go with (torch first) and try them
        run: python scripts/smoke_wheels.py --dist dist --python ${{ matrix.python }} --others index

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # The environment can require an approval before a release.
    environment:
      name: pypi
      url: https://pypi.org/user/licyk/
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install Twine
        run: uv pip install --upgrade twine
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        # Mizuoto first, so a gated package that needs the new Mizuoto never appears before it. A version already on
        # PyPI is skipped, so a tag pushed after its version's main release only adds the GitHub release.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          shopt -s nullglob
          host=(dist/mizuoto-[0-9]*)
          gated=(dist/mizuoto_*)
          if [ ${#host[@]} -gt 0 ]; then python -m twine upload "${host[@]}" --skip-existing --non-interactive; fi
          if [ ${#gated[@]} -gt 0 ]; then python -m twine upload "${gated[@]}" --skip-existing --non-interactive; fi

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the release with the built files
        # Its notes start at the previous tag of the same distribution; only Mizuoto's releases are marked latest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          prefix="${tag%%[0-9]*}"
          previous=$(git tag --list "${prefix}[0-9]*" --sort=-v:refname | awk -v t="$tag" 'found { print; exit } $0 == t { found = 1 }')
          args=(--title "$tag" --generate-notes)
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          if [ "$prefix" != v ]; then args+=(--latest=false); fi
          gh release create "$tag" dist/* "${args[@]}"
