# What every push must pass: Mizuoto with every engine on three platforms and four Python versions, on a CPU build
# of torch, each cell linted, type-checked for its own Python and platform, and tested; the oldest torch it supports
# and the newest; the web UI's tests and types; the generated API types; the documentation site's types, tests and
# build. Release (release.yml) runs this file as its checks.
name: CI

on:
  push:
    # Branches only: a version tag starts Release, which runs these checks itself.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when Release runs this file, so the two runs never share a group (and one
# never cancels the other).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # torch's build is the user's choice; CI takes the CPU build (macOS: the index's arm64 wheels, MPS included).
  TORCH_INDEX: https://download.pytorch.org/whl/cpu
  # uv installs into the interpreter setup-python provides (no virtual environment). Its cache stays off: unpacked
  # wheels (CPU torch alone is about 1 GB) for every cell would crowd the 10 GB cache limit, and uv downloads them
  # about as fast as a cache restores.
  UV_SYSTEM_PYTHON: 1

jobs:
  # A push to main that changes mizuoto/version.py starts Release, which runs this file as its checks; CI's own run
  # of that push sets `run` to false, which skips every job below. github.workflow is "Release" inside that call, so
  # the call itself always runs. The changed files come from the compare API (the push's before...after, as
  # Release's `paths` filter sees it); any failure runs CI.
  gate:
    name: Not checked by Release
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$WORKFLOW" = CI ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename'); then
              printf 'Changed files:\n%s\n' "$files"
              if grep -qx 'mizuoto/version.py' <<< "$files"; then
                echo "Release runs these checks for this push."
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  host:
    name: host · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on Windows too, so a failed install stops the step.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The CPU index has torch wheels for every cell (Linux x86_64, Windows x86_64, macOS arm64; CPython 3.10–3.13),
        # and every compiled dependency publishes wheels for them too (checked with uv pip compile --only-binary).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Environment
        id: environment
        run: |
          uv pip install torch --index-url "$TORCH_INDEX"
          uv pip install -e . -e packages/native/fishspeech -e packages/native/indextts pytest pytest-cov ruff ty httpx tomli
      # Lint, types and tests each run once the environment is there, so one failing does not hide the others.
      - name: Lint
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python scripts/dev.py lint
      - name: Types
        # For this cell's Python and platform: the standard library's stubs differ between them.
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: |
          platform=$(python -c "import sys; print({'win32': 'win32', 'darwin': 'darwin'}.get(sys.platform, 'linux'))")
          python scripts/dev.py typecheck-py --python-version "${{ matrix.python }}" --python-platform "$platform"
      - name: Tests
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: python -m pytest -q

  torch:
    # API drift: the oldest torch Mizuoto supports (pyproject: torch>=2.8) and the newest release.
    name: torch ${{ matrix.torch }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.8.0", "latest"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Environment
        run: |
          if [ "${{ matrix.torch }}" = latest ]; then spec=torch; else spec="torch==${{ matrix.torch }}"; fi
          uv pip install --upgrade "$spec" --index-url "$TORCH_INDEX"
          uv pip install -e . -e packages/native/fishspeech -e packages/native/indextts pytest httpx tomli
          python -c "import torch; print('torch', torch.__version__)"
      - name: Tests
        run: python -m pytest -q

  web:
    name: Web UI
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Environment
        # The API's schema comes from the Python package (torch's CPU build: Mizuoto depends on torch).
        run: |
          uv pip install torch --index-url "$TORCH_INDEX"
          uv pip install -e .
      - name: Web UI tests, types, and the API types it is built against
        run: |
          python scripts/dev.py web-install
          python scripts/dev.py test-web
          python scripts/dev.py typegen-check

  site:
    name: Documentation site
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Environment
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Types, tests and build
        run: |
          bun run check
          bun run test
          bun run build
        working-directory: site
